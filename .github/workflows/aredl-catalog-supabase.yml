name: AREDL - synchronisation globale Supabase

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'preview = aperçu ; stage = table d’attente ; publish = publier les fiches sans conflit'
        type: choice
        required: true
        default: preview
        options:
          - preview
          - stage
          - publish
      allow_partial_publish:
        description: 'Publier uniquement les fiches valides si des ID sont manquants / dupliqués (consulter le rapport preview avant)'
        type: boolean
        required: false
        default: false
  schedule:
    - cron: '0 */6 * * *'  # Actualise uniquement la table d'attente, sans publier.

permissions:
  contents: read

concurrency:
  group: dlfr-aredl-global-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: aredl-import
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tests de l'importateur
        run: python -m unittest discover -s tests -p 'test_aredl_catalog_sync.py' -v
      - name: Lire tout le catalogue AREDL et mettre à jour Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          USER_MODE: ${{ inputs.mode }}
          EVENT_NAME: ${{ github.event_name }}
          ALLOW_PARTIAL: ${{ inputs.allow_partial_publish }}
        run: |
          if [[ "$EVENT_NAME" == "schedule" ]]; then MODE=stage; else MODE="${USER_MODE:-preview}"; fi
          echo "Mode : $MODE"
          args=(--mode "$MODE" --output out/aredl-global)
          if [[ "$MODE" == "publish" && "$ALLOW_PARTIAL" == "true" ]]; then
            args+=(--allow-partial-publish)
          fi
          python tools/aredl_catalog_sync.py "${args[@]}"
      - name: Conserver le rapport de contrôle (sans secret)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-aredl-global-${{ github.run_number }}
          path: out/aredl-global.*
          if-no-files-found: warn
          retention-days: 14
