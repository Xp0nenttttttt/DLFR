name: Préparer import groupé NLW français
on:
  workflow_dispatch:
    inputs:
      start_aredl_rank:
        description: 'Premier rang AREDL à examiner (1 = tous ; distinct du rang DLFR 238)'
        default: '1'
        required: true
        type: string
      end_aredl_rank:
        description: 'Dernier rang AREDL (0 = jusqu’à la fin)'
        default: '0'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: aredl-bulk-fr
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collecter les niveaux et preuves FR (aucune écriture Supabase)
        env:
          START_RANK: ${{ inputs.start_aredl_rank }}
          END_RANK: ${{ inputs.end_aredl_rank }}
        run: python tools/aredl_bulk_fr.py --start-rank "$START_RANK" --end-rank "$END_RANK"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aredl-fr-import
          path: out/aredl-fr-bulk.json
          if-no-files-found: error
